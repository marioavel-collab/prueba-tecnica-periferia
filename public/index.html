<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agente IA - Registro de Proveedores</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#f5f7fa;color:#1f2937}.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 10px #0001}.row{display:flex;gap:10px}input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px}button{padding:12px 18px;border:0;border-radius:8px;cursor:pointer}#send{background:#2563eb;color:#fff}#confirm{background:#16a34a;color:#fff;display:none;margin-top:15px}.msg{padding:12px;margin:10px 0;border-radius:8px;background:#eef2ff}</style></head><body><div class="card"><h1>Agente IA - Registro de Proveedores</h1><p>Escribe qué deseas procesar y el agente analizará la solicitud.</p><div class="row"><input id="casoId" value="co-industrias-delta" placeholder="Ej: Quiero procesar el caso co-industrias-delta"><button id="send">Validar</button></div><div id="chat"></div><button id="confirm">Confirmar procesamiento</button></div><script>const chat=document.getElementById('chat'),casoInput=document.getElementById('casoId'),confirmButton=document.getElementById('confirm'); let casoActual='';document.getElementById('send').addEventListener('click',async function(){const casoId=casoInput.value.trim();if(!casoId){chat.innerHTML='<div class="msg">Ingresa un caso.</div>';return}chat.innerHTML='<div class="msg">Agente: consultando la información del proveedor...</div>';confirmButton.style.display='none';try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mensaje:casoId})}),data=await response.json();if(!data.ok){chat.innerHTML='<div class="msg">Error: '+data.error+'</div>';return}casoActual=data.casoId || ''; const v=data.validacion;let text='Agente: Validación completada.<br><br>';text+='Estado: '+(v.valido?'Información válida':'Información con errores')+'<br>';text+='Confirmación requerida: '+(v.requiereConfirmacion?'Sí':'No')+'<br>';if(v.camposFaltantes.length)text+='Campos faltantes: '+v.camposFaltantes.join(', ')+'<br>';if(v.errores.length)text+='Errores: '+v.errores.join(', ')+'<br>';chat.innerHTML='<div class="msg">'+text+'</div>';if(v.valido&&v.requiereConfirmacion)confirmButton.style.display='inline-block'}catch(error){chat.innerHTML='<div class="msg">No fue posible conectar con el backend.</div>'}});confirmButton.addEventListener('click',async function(){const casoId=casoActual;chat.innerHTML+='<div class="msg">Usuario: Confirmo el procesamiento del caso '+casoId+'.</div>';confirmButton.style.display='none';try{const response=await fetch('/api/confirmar?casoId='+encodeURIComponent(casoId));const data=await response.json();if(!data.ok){chat.innerHTML+='<div class="msg">Agente: No fue posible completar el procesamiento: '+data.error+'</div>';return}chat.innerHTML+='<div class="msg">Agente: Confirmación recibida. El paquete fue generado correctamente.<br><br>Estado: '+data.estado+'<br>Archivo: '+data.paquete+'</div>'}catch(error){chat.innerHTML+='<div class="msg">Agente: Ocurrió un error al generar el paquete.</div>'}});</script></body></html>
